    <path d="M32 43.5 V46.4 M32 46.4 C30.6 48.4 28.2 48.8 26.6 47.5 M32 46.4 C33.4 48.4 35.8 48.8 37.4 47.5"
          fill="none" stroke-width="1.4"/>
    <g fill="#2a1a0b" stroke="none">
      <circle cx="25.4" cy="43.4" r=".7"/>
      <circle cx="23.6" cy="45.4" r=".7"/>
      <circle cx="38.6" cy="43.4" r=".7"/>
      <circle cx="40.4" cy="45.4" r=".7"/>
