<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Leopard emblem">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5f8f"/>
      <stop offset="1" stop-color="#152740"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f97b8"/>
      <stop offset="1" stop-color="#4b6386"/>
    </linearGradient>
  </defs>
  <g stroke="#04080f" stroke-linejoin="round" stroke-linecap="round">
    <!-- angular head with pointed ears -->
    <path d="M32 10 L41 12.5 L50 7 L52.5 20 L57.5 30 L53.5 42 L44 52 L32 58 L20 52 L10.5 42 L6.5 30 L11.5 20 L14 7 L23 12.5 Z"
          fill="url(#fur)" stroke-width="2"/>
    <path d="M15.5 10.5 L21.5 13.4 L16.8 18.6 Z" fill="#04080f" stroke="none"/>
    <path d="M48.5 10.5 L42.5 13.4 L47.2 18.6 Z" fill="#04080f" stroke="none"/>

    <!-- muzzle -->
    <path d="M24 37.5 L32 34.5 L40 37.5 L42.5 46.5 L32 54.5 L21.5 46.5 Z" fill="url(#muzzle)" stroke="none"/>

    <!-- forehead spots -->
    <g fill="#04080f" stroke="none">
      <path d="M32 14.5 L33.6 16.4 L32 18.3 L30.4 16.4 Z"/>
      <circle cx="26.6" cy="18.4" r="1.3"/>
      <circle cx="37.4" cy="18.4" r="1.3"/>
      <circle cx="32" cy="22" r="1.1"/>
      <circle cx="22.2" cy="22.6" r="1.1"/>
      <circle cx="41.8" cy="22.6" r="1.1"/>
      <circle cx="17.4" cy="25.6" r="1"/>
      <circle cx="46.6" cy="25.6" r="1"/>
    </g>
    <!-- cheek rosettes -->
    <g fill="none" stroke="#04080f" stroke-width="1.7">
      <path d="M11.4 35.2 L13.8 32.8 L16.2 33.6"/>
      <path d="M13.2 40.6 L11.6 38.4"/>
      <path d="M17.6 45 L15 43.6"/>
      <path d="M52.6 35.2 L50.2 32.8 L47.8 33.6"/>
      <path d="M50.8 40.6 L52.4 38.4"/>
      <path d="M46.4 45 L49 43.6"/>
    </g>

    <!-- heavy brows, angled down toward the nose -->
    <path d="M13.5 25.8 L28.6 29.2 L27.8 31.4 L14.6 28.6 Z" fill="#04080f" stroke="none"/>
    <path d="M50.5 25.8 L35.4 29.2 L36.2 31.4 L49.4 28.6 Z" fill="#04080f" stroke="none"/>

    <!-- narrow glowing eyes with slit pupils -->
    <path d="M15.6 30.6 L27.4 32.4 L23.6 35.2 L17.4 34.2 Z" fill="#7dd3fc" stroke-width="1.1"/>
    <path d="M48.4 30.6 L36.6 32.4 L40.4 35.2 L46.6 34.2 Z" fill="#7dd3fc" stroke-width="1.1"/>
    <path d="M21.5 31.5 L22.5 31.6 L22.6 34.8 L21.4 34.6 Z" fill="#04080f" stroke="none"/>
    <path d="M42.5 31.5 L41.5 31.6 L41.4 34.8 L42.6 34.6 Z" fill="#04080f" stroke="none"/>

    <!-- tear lines -->
    <path d="M27.2 33.2 L29.2 39.2" fill="none" stroke-width="1.5"/>
    <path d="M36.8 33.2 L34.8 39.2" fill="none" stroke-width="1.5"/>

    <!-- nose and mouth -->
    <path d="M27.8 39 L36.2 39 L32 43.8 Z" fill="#04080f" stroke-width="1"/>
    <path d="M32 43.8 L32 47.2 M32 47.2 L26.6 49.6 M32 47.2 L37.4 49.6" fill="none" stroke-width="1.5"/>
    <!-- fangs -->
    <path d="M28.4 49 L29.4 52.6 L30.2 48.6 Z" fill="#e8eef7" stroke-width=".6"/>
    <path d="M35.6 49 L34.6 52.6 L33.8 48.6 Z" fill="#e8eef7" stroke-width=".6"/>
  </g>
</svg>
