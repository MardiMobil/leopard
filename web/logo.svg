    <!-- lighter cheeks and muzzle -->
    <path d="M32 35 C39 35 44.5 39.5 44.5 45.5 C44.5 51.5 39 55 32 55 C25 55 19.5 51.5 19.5 45.5 C19.5 39.5 25 35 32 35 Z"
          fill="#f7e6c4" stroke="none"/>

    <!-- rosettes / spots -->
    <g fill="#2a1a0b" stroke="none">
      <circle cx="32" cy="17" r="1.7"/>
      <circle cx="26.5" cy="19" r="1.4"/>
      <circle cx="37.5" cy="19" r="1.4"/>
      <circle cx="32" cy="22.3" r="1.3"/>
      <circle cx="22" cy="22" r="1.2"/>
      <circle cx="42" cy="22" r="1.2"/>
      <circle cx="28.3" cy="24.6" r="1"/>
      <circle cx="35.7" cy="24.6" r="1"/>
      <circle cx="17.5" cy="26" r="1.1"/>
      <circle cx="46.5" cy="26" r="1.1"/>
    </g>
    <g fill="none" stroke="#2a1a0b" stroke-width="1.6">
      <path d="M12.6 35 A3 3 0 0 1 15.6 32.4"/>
      <path d="M14.4 39.8 A3 3 0 0 1 12.4 37.4"/>
      <path d="M16.6 44.5 A2.6 2.6 0 0 1 14 42.6"/>
      <path d="M51.4 35 A3 3 0 0 0 48.4 32.4"/>
      <path d="M49.6 39.8 A3 3 0 0 0 51.6 37.4"/>
      <path d="M47.4 44.5 A2.6 2.6 0 0 0 50 42.6"/>
    </g>

    <!-- eyes -->
    <path d="M17.5 31 C20 27.4 25 27 28.2 30.6 C25.6 33.2 20.6 33.6 17.5 31 Z" fill="#d6e25b" stroke-width="1.5"/>
    <path d="M46.5 31 C44 27.4 39 27 35.8 30.6 C38.4 33.2 43.4 33.6 46.5 31 Z" fill="#d6e25b" stroke-width="1.5"/>
    <ellipse cx="23.2" cy="30.6" rx="1.3" ry="2.4" fill="#120b05" stroke="none"/>
    <ellipse cx="40.8" cy="30.6" rx="1.3" ry="2.4" fill="#120b05" stroke="none"/>
    <circle cx="23.8" cy="29.6" r=".5" fill="#fff8e6" stroke="none"/>
    <circle cx="41.4" cy="29.6" r=".5" fill="#fff8e6" stroke="none"/>
    <!-- markings from the inner eye corners -->
    <path d="M27.8 32.2 C28.6 34 29 35.6 29.3 37.4" fill="none" stroke-width="1.4"/>
    <path d="M36.2 32.2 C35.4 34 35 35.6 34.7 37.4" fill="none" stroke-width="1.4"/>

    <!-- nose and mouth -->
    <path d="M27.6 39.4 C27.6 38.1 36.4 38.1 36.4 39.4 C36.4 41 34 43 32 43.5 C30 43 27.6 41 27.6 39.4 Z"
