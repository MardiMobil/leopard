<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MardiMobil leopard">
  <g stroke="#24170b" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <path d="M14 23 C10.5 15 11.5 8 17 7 C21.5 6.8 25.5 11 27.5 15.5 Z" fill="#e9a23b" stroke-width="2"/>
    <path d="M50 23 C53.5 15 52.5 8 47 7 C42.5 6.8 38.5 11 36.5 15.5 Z" fill="#e9a23b" stroke-width="2"/>
    <path d="M16.6 18.5 C15.4 13.8 16 10.4 18.2 10.2 C20.4 10.4 22.4 12.6 23.6 15.4 Z" fill="#4a2f17" stroke="none"/>
    <path d="M47.4 18.5 C48.6 13.8 48 10.4 45.8 10.2 C43.6 10.4 41.6 12.6 40.4 15.4 Z" fill="#4a2f17" stroke="none"/>

    <!-- head -->
    <path d="M32 12 C45.5 12 54.5 20.5 54.5 33 C54.5 45.5 45.5 55 32 56.5 C18.5 55 9.5 45.5 9.5 33 C9.5 20.5 18.5 12 32 12 Z"
